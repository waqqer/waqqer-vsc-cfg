version: '3'

tasks:
  update:
    desc: Open the VS Code configuration menu
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./configure.ps1
    silent: true
    
  install:
    desc: Open the VS Code configuration menu
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./configure.ps1
    silent: true

  cinst:
    desc: Open the VS Code configuration menu
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./configure.ps1
    silent: true

  li-install:
    desc: Open the VS Code configuration menu on Linux
    cmds:
      - bash ./configure.sh
    silent: true

  li-clean-install:
    desc: Open the VS Code configuration menu on Linux
    cmds:
      - bash ./configure.sh
    silent: true

  li-update:
    desc: Open the VS Code configuration menu on Linux
    cmds:
      - bash ./configure.sh
    silent: true
